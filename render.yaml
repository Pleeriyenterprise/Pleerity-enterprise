# Render Blueprint — LEGACY single-service reference (Pleerity Enterprise).
#
# For staging/production separation use:
#   render.staging.yaml    → branch develop, DB pleerity_staging, STRIPE_MODE=test
#   render.production.yaml → branch main, DB pleerity_production, STRIPE_MODE=live
# See docs/DEPLOYMENT_WORKFLOW.md
#
# Render Blueprint — FastAPI backend (Pleerity Enterprise).
#
# New stack: Dashboard → New → Blueprint → select this repo (render.yaml is detected).
# Existing Web Service: do not duplicate the service; copy startCommand + root directory
# from below into Settings → Build & Deploy.
#
# Render probes the port in $PORT. A fixed port (e.g. 8001) causes
# "Port scan timeout / no open ports". See docs/RENDER_STARTUP_DIAGNOSIS.md.
#
# Persistent disk: document vault, intake uploads, and quarantine must live under the
# disk mount or they are lost on redeploy. Existing services: add the same disk + env
# in the dashboard if not created from this blueprint.

services:
  - type: web
    name: pleerity-api
    runtime: python
    rootDir: backend
    # Use scripts/render_build.sh — PyPI read timeouts are common on Render (tzdata, httpcore).
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: pleerity-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PIP_DEFAULT_TIMEOUT
        value: "180"
      - key: DATA_DIR
        value: /var/data
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/data/documents
      - key: INTAKE_UPLOAD_DIR
        value: /var/data/uploads/intake
      - key: INTAKE_QUARANTINE_DIR
        value: /var/data/uploads/intake_quarantine
      - key: ENVIRONMENT
        value: staging
      - key: DEPLOYMENT_TIER
        value: staging
      - key: DB_NAME
        value: pleerity_staging
      - key: APP_BASE_URL
        value: https://pleerity-enterprise-9jjg.vercel.app
      - key: API_BASE_URL
        value: https://pleerity-enterprise.onrender.com
      # Rent reminder live delivery — staging-safe: allowlisted client + yopmail recipients only.
      # Production: set RENT_REMINDERS_PRODUCTION_MODE=true (all RENT_OPERATIONS clients, any tenant domain).
      - key: RENT_REMINDERS_LIVE_SEND
        value: "true"
      - key: RENT_REMINDERS_LIVE_SEND_CLIENT_ALLOWLIST
        value: "6fd5ac4c-3fd4-4112-ade7-156977deb49f"
      - key: RENT_REMINDERS_SAFE_RECIPIENT_DOMAINS
        value: "yopmail.com"
      # Phase 2–5 lifecycle flags — staging shadow observe-only (legacy blueprint parity with render.staging.yaml).
      - key: LIFECYCLE_AWARE_CONFIRM
        value: "shadow"
      - key: LIFECYCLE_AWARE_EXTRACTION
        value: "shadow"
      - key: LIFECYCLE_AWARE_SCORING
        value: "shadow"
      - key: LIFECYCLE_AWARE_REMINDERS
        value: "shadow"
      - key: LIFECYCLE_AWARE_KPIS
        value: "shadow"
      # - key: RENT_REMINDERS_PRODUCTION_MODE
      #   value: "true"
